name: Fleet manager tests and ROS 2 build

on:
  push:
    paths:
      - "fleet_manager/**"
      - "robot_agent/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "fleet_manager/**"
      - "robot_agent/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/python-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip pytest
      - name: Run fleet manager tests
        working-directory: fleet_manager
        run: PYTHONPATH=. pytest -q test
      - name: Run robot agent protocol tests
        working-directory: robot_agent
        run: PYTHONPATH=. pytest -q test
      - name: Check Python syntax
        run: python -m compileall -q fleet_manager robot_agent

  ros2-humble-build:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install build and Nav2 message dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-pytest \
            ros-humble-nav2-msgs \
            ros-humble-geometry-msgs
          rm -rf /var/lib/apt/lists/*
      - name: Build ROS 2 packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          mkdir -p /tmp/fleet_ws/src
          cp -a fleet_manager robot_agent /tmp/fleet_ws/src/
          cd /tmp/fleet_ws
          colcon build --symlink-install
      - name: Run ROS package tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd /tmp/fleet_ws
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
