name: Fleet manager Python tests

on:
  push:
    paths:
      - "fleet_manager/**"
      - "robot_agent/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "fleet_manager/**"
      - ".github/workflows/python-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip pytest
      - name: Run fleet allocation tests
        working-directory: fleet_manager
        run: PYTHONPATH=. pytest -q test
      - name: Run robot agent protocol tests
        working-directory: robot_agent
        run: PYTHONPATH=. pytest -q test
      - name: Check Python syntax
        run: python -m compileall -q fleet_manager robot_agent
